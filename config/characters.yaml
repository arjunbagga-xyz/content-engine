  # ============================================================================
  # REAL FACELESS DEBATE ACCOUNT
  # type: faceless => lean memory (topic dedup, no narrative arcs).
  # pipeline: debate_2lead_cameo => routed to produce_account_debate (generic).
  # All per-account tuning lives HERE in YAML, not in code.
  # prompt_templates: multiple strings with {{variables}} plugged at runtime by
  #   the PromptBuilder (topic / speaker / persona / tone / trading_angle /
  #   recent_topics / ctx). Trend scout + memory system fill these later.
  # ============================================================================
  faceless_7:
    id: tate_vs_peppa
    name: Tate vs Peppa
    status: active
    type: faceless
    pipeline: debate_2lead_cameo
    role: Global geopolitical / nature / cultural debate where both sides make solid points, with a sharp trading angle.
    visual_keywords: debate, geopolitics, nature, culture, trading
    platforms:
    - instagram
    # Speakers = the two fixed debate leads. Cameos = occasional guest voices.
    speakers: [tate, peppa]
    cameos: [trump, peter, hulk]
    cameo_prob: 0.35
    topic_universe:
    - geopolitical
    - nature
    - cultural
    - historical
    trading_angle: true
    tone: "funny, both sides make solid points, in their own classic talking style"
    seg_range: [8, 16]
    reel_style: contextual sprite overlay on gameplay (two leads alternate; occasional cameo drops in)
    sprite_folder: data/sprites_clean
    gameplay_folder: data/gameplay
    # Multiple prompt templates; PromptBuilder picks one per turn and fills vars.
    prompt_templates:
    - "TOPIC: {{topic}}\nACCOUNT: {{account_name}} — {{role}}\nTHIS SPEAKER: {{speaker}} — {{persona}}\nWHAT'S BEEN SAID:\n{{ctx}}\n\nYou are in a {{tone}}. Deliver ONE short take (1-2 sentences) as {{speaker}}, in your exact voice. {{trading_note}} Reference the topic or what someone just said. Be funny. Output ONLY the line, no quotes, no 'Speaker:' prefix."
    - "TOPIC: {{topic}}\nTHIS SPEAKER: {{speaker}} — {{persona}}\nRECENT TOPICS WE'VE ALREADY DEBATED: {{recent_topics}}\nMake a fresh, funny point as {{speaker}} that we HAVEN'T covered. {{trading_note}} Output ONLY the line."
    - "TOPIC: {{topic}}\nTHIS SPEAKER: {{speaker}} — {{persona}}\nWHAT'S BEEN SAID:\n{{ctx}}\nHit back at the other side with a solid, funny rebuttal as {{speaker}}. {{trading_note}} Output ONLY the line, no quotes."
    characters:
      tate:
        voice_persona: "alpha posturing, motivational but unhinged, says 'bro' unironically, confidence as a personality, makes money/discipline/cope points"
        sprite_tags: [tate]
        tts_voice: en-US-GuyNeural
      peppa:
        voice_persona: "oblivious child logic, declares things loudly, asks why 40 times, unshakeable confidence, references Mummy Pig / Daddy Pig / muddy puddles"
        sprite_tags: [peppa]
        tts_voice: en-US-AriaNeural
      trump:
        voice_persona: "grandiose, deflects everything, calls things the best and the worst, never admits fault, makes it about deals"
        sprite_tags: [trump]
        tts_voice: en-US-SteffanNeural
      peter:
        voice_persona: "oblivious, says the dumb thing with total confidence, deadpan"
        sprite_tags: [peter]
        tts_voice: en-US-ChristopherNeural
      hulk:
        voice_persona: "simple, angry, punches problems, speaks in third person, secretly tired"
        sprite_tags: [hulk]
        tts_voice: en-US-BrianNeural
